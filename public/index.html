<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penny · Money companion for life</title>
<meta name="description" content="Penny is a money companion for kids from 8 and for grown-ups: save, spend, borrow, trade and spot scams in a friendly town. Everything is simulated except the Piggy Bank, which only records savings you report.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7FAF8">
<link rel="icon" href="assets/svg/mark.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/lab.css">
<link rel="stylesheet" href="assets/css/v4-shell.css">
<link rel="stylesheet" href="assets/css/v4-arena.css">
<link rel="stylesheet" href="assets/css/v4-penny.css">
<link rel="stylesheet" href="assets/css/v4-town.css">
<script type="module" src="assets/js/app.js"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="brand" href="#/">
      <svg class="brand__mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#0DA678"/>
        <rect x="7" y="17" width="4.5" height="8" rx="2.25" fill="#FFFFFF"/>
        <rect x="13.75" y="12" width="4.5" height="13" rx="2.25" fill="#FFFFFF"/>
        <rect x="20.5" y="7" width="4.5" height="18" rx="2.25" fill="#FFFFFF"/>
      </svg>
      <span class="brand__name" data-slot="product-name"></span>
    </a>
    <div class="app-header__actions">
    </div>
  </header>

  <main id="main" class="app-main" tabindex="-1">
    <div class="state state--loading" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <p class="state__title">Loading…</p>
      <p class="state__body boot__slow">This is taking longer than usual. Check your connection, then reload the page.</p>
    </div>
    <noscript>
      <div class="state state--error">
        <p class="state__title">This simulation needs JavaScript</p>
        <p class="state__body">Turn on JavaScript in your browser settings, then reload the page.</p>
      </div>
    </noscript>
  </main>

  <footer class="app-footer">
    <p class="app-footer__sim"><span class="app-footer__dot" aria-hidden="true"></span><strong>Simulation · No real money</strong></p>
    <p>Educational simulation. Not financial advice. No real cryptocurrency is bought, sold or held.</p>
    <p class="app-footer__credit">Built by <a href="https://cenedury.com" target="_blank" rel="noopener">Cenedury</a></p>
  </footer>
</div>
<div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
